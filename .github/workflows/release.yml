name: Release

# Builds the engine on Linux (x64 + arm64) and publishes one GitHub Release per V*.*.* tag.
# Nothing is published unless EVERY platform's ctest passes: the release job has `needs: build`,
# so any red matrix leg cancels it.
# NOTE: Windows support is in progress — temporarily excluded from this matrix.
on:
  push:
    tags:
      # Lowercase v — the convention the repo actually pushes (v1.0.0). The old
      # uppercase "V*.*.*" pattern never matched a real tag, so releases silently
      # never fired.
      - "v*.*.*"

permissions:
  contents: write          # needed to create the release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            platform: linux64
            artifact: lucyn-linux-x64.tar.gz
            cmake_flags: '-DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 ca-certificates curl xvfb xauth \
            libx11-dev

      - name: Fetch CEF
        run: ./scripts/install.sh --yes --platform ${{ matrix.platform }}

      - name: Configure (Release)
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: xvfb-run --auto-servernum ctest --test-dir build --build-config Release --output-on-failure

      - name: "Package (self-contained: binary + Chromium runtime)"
        run: |
          set -euo pipefail
          mkdir -p dist/scripts
          cp build/bin/lucyn dist/lucyn
          # lucyn's rpath is $ORIGIN/cef — a binary WITHOUT its cef/ folder cannot
          # start, so the whole Chromium runtime travels inside the tarball.
          cp -a build/bin/cef dist/cef
          # Default adblock filter lists are read from <exeDir>/adblock-filters/.
          cp -a build/bin/adblock-filters dist/adblock-filters
          # nothing-data/ is user state (cookies, captures, CEF cache) — never shipped.
          #
          # The distro's libcef.so carries debug symbols (1.4 GB). Stripping takes the
          # tarball from roughly 700 MB to ~150 MB with zero runtime impact.
          strip --strip-unneeded dist/lucyn dist/cef/libcef.so
          cp scripts/install.sh scripts/update_cef.sh dist/scripts/
          chmod +x dist/lucyn dist/scripts/*.sh
          tar -czf "${{ matrix.artifact }}" -C dist lucyn cef adblock-filters scripts
          ls -la "${{ matrix.artifact }}"
          echo "tarball contents (top level):"
          tar -tzf "${{ matrix.artifact }}" | awk -F/ '{print $1}' | sort -u

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - name: Create release with auto-generated notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true