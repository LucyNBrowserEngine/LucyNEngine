name: Release

# Publishes SOURCE ONLY.
#
# Nothing is compiled here, no CEF is downloaded, and no binaries are attached.
# CEF (Chromium Embedded Framework) is ~1.5 GB per platform and 3+ GB unpacked;
# shipping one build per OS/arch is far too big for GitHub Actions and its
# artifact limits. So a release is:
#
#   LucyN-<version>-source.zip   the tracked source at that tag (no CEF, no build/)
#   release.json                 version + the CEF build it expects + download URL
#
# release.json lives at the repo root and is refreshed on main after each
# release, so a plain GET of the raw file answers "what is the current version
# and where do I download it":
#
#   curl -s https://raw.githubusercontent.com/LucyNBrowserEngine/LucyNEngine/main/release.json
#
# Lowercase "v*.*.*" tags still belong to npm-publish.yml (JSR). This workflow
# owns capital "V*.*.*" only.
on:
  push:
    tags:
      - "V*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-release:
    name: Publish source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the pinned CEF version
        id: cef
        run: |
          set -euo pipefail
          . ./cef-version.txt
          echo "version=$cef_version" >> "$GITHUB_OUTPUT"
          echo "build=$cef_build" >> "$GITHUB_OUTPUT"
          echo "chromium=$chromium_version" >> "$GITHUB_OUTPUT"

      - name: Derive the version from the tag
        id: tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#[Vv]}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag '$GITHUB_REF_NAME' is not VMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # `git archive` packages tracked files only, so the gitignored
      # third_party/cef and build/ trees can never end up in the zip.
      - name: Zip the source (no binaries, no CEF)
        run: |
          set -euo pipefail
          NAME="LucyN-${{ steps.tag.outputs.version }}"
          git archive --format=zip --prefix="$NAME/" -o "$NAME-source.zip" "$GITHUB_SHA"
          ls -lh "$NAME-source.zip"

          # A release that quietly grows a binary or a CEF tree is a bug, not a feature.
          if unzip -l "$NAME-source.zip" | grep -Ei '\.(so|dll|dylib|exe|a|bin)$|/cef/|/build/|libcef'; then
            echo "refusing to publish: the archive contains binaries or a CEF distribution" >&2
            exit 1
          fi

      - name: Write release.json and the release notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          CEF_VERSION: ${{ steps.cef.outputs.version }}
          CEF_BUILD: ${{ steps.cef.outputs.build }}
          CHROMIUM: ${{ steps.cef.outputs.chromium }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          cef = os.environ["CEF_VERSION"]
          cef_build = os.environ["CEF_BUILD"]
          chromium = os.environ["CHROMIUM"]

          notice = (
              "USING LUCYN REQUIRES YOU TO BUILD IT ON YOUR OWN MACHINE. We have no servers "
              "that can build LucyN for you, let alone host the builds: CEF (Chromium Embedded "
              "Framework) is about 1.5 GB per platform and 3+ GB unpacked, which is too big for "
              "GitHub Actions and far too big for us to publish for every OS and CPU "
              "architecture. Every release is the source code, zipped - nothing is compiled and "
              "no CEF is included. Fetch the CEF build listed above, then build with CMake."
          )

          manifest = {
              "name": "LucyN",
              "version": version,
              "cef_version": cef,
              "cef_build": cef_build,
              "chromium_version": chromium,
              "requires_local_build": True,
              "notice": notice,
              "download_url": (
                  f"https://github.com/{repo}/releases/download/{tag}/LucyN-{version}-source.zip"
              ),
              "source_archive_url": f"https://github.com/{repo}/archive/refs/tags/{tag}.zip",
              "release_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "docs_url": f"https://github.com/{repo}/blob/main/docs/building.md",
          }
          with open("release.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")

          zip_url = manifest["download_url"]
          body = f"""## LucyN {version} — source only
          
          This release is the **source code, zipped**. Nothing is compiled here, and no CEF
          distribution is included or built by CI.
          
          | | |
          |---|---|
          | LucyN | `{version}` |
          | CEF | `{cef}` (build {cef_build}) |
          | Chromium | `{chromium}` |
          
          > {notice}
          
          ```bash
          curl -L -o lucyn-source.zip {zip_url}
          unzip lucyn-source.zip && cd LucyN-{version}
          ./scripts/install.sh --version '{cef}'   # fetches that exact CEF build into third_party/cef/
          cmake -S . -B build && cmake --build build -j
          ```
          """
          with open("release-body.md", "w") as f:
              f.write(body)

          print(open("release.json").read())
          PY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="LucyN-${{ steps.tag.outputs.version }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "$NAME-source.zip" release.json
            gh release edit "$GITHUB_REF_NAME" \
              --title "LucyN ${{ steps.tag.outputs.version }} (source)" \
              --notes-file release-body.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "LucyN ${{ steps.tag.outputs.version }} (source)" \
              --notes-file release-body.md \
              "$NAME-source.zip" release.json
          fi

      # The raw file on main is the "latest version + download URL" endpoint.
      # Only fast-forward: a tag on an old commit must never rewind main.
      - name: Refresh release.json on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "tag is not on main; leaving main's release.json untouched"
            exit 0
          fi
          if git diff --quiet -- release.json; then
            echo "main's release.json already matches this release"
            exit 0
          fi
          git add release.json
          git commit -m "chore: release.json -> ${{ steps.tag.outputs.version }}"
          git push origin HEAD:main
