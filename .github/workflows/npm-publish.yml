name: Publish

# Publishes client/ to JSR as @lucyn/browser.
# JSR's own GitHub Actions recipe, with two changes for this repo:
#   * it triggers on v*.*.* tag pushes instead of pushes to main
#   * --allow-dirty, and working-directory: client (the package lives in client/, not the root)
# Authentication is OIDC — no JSR_TOKEN/NPM_TOKEN secret is needed: the repo is linked to
# https://jsr.io/@lucyn/browser, so `permissions: id-token: write` is what grants the publish.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # v1.0.0 -> 1.0.0 in client/jsr.json, so the published version matches the tag.
      - name: Set version from the git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"          # strip the leading v
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          export VERSION
          node -e '
            const fs = require("fs");
            const p = "client/jsr.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log(`${j.name}@${j.version}`);
          '

      - name: Publish package
        working-directory: client
        run: npx jsr publish --allow-dirty
